[package]
name = "wgpu-socket"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = { version = "0.36.2", default-features = false, features = ["wayland", "x11"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30.0.1"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
